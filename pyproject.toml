[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-channel-parser"
version = "0.1.0"
description = "Telegram channel parser with AI filtering and response generation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "python-telegram-bot>=21.0",
    "telethon>=1.38",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
freelance-parser = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
